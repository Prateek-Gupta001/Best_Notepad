<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --header-from:#fbfdff;
    --header-to:#eaf1f9;
    --border:#d3dfec;
    --text:#232323;
    --dim:#8a8f97;
    --accent:#2f6fa8;
    --accent-soft:#e4eefa;
    --toolbar-bg:#f5f9fd;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    height:100%;
    color:var(--text);
    font-family:Roboto, Arial, sans-serif;
  }
  body{
    display:flex; flex-direction:column; min-height:100vh;
    background:
      radial-gradient(circle at 18% 8%, rgba(255,255,255,0.16) 0%, transparent 42%),
      radial-gradient(circle at 85% 0%, rgba(255,255,255,0.10) 0%, transparent 38%),
      linear-gradient(165deg, #163f66 0%, #1f5f95 38%, #3a83b8 72%, #6bb0d8 100%);
    background-attachment:fixed;
  }

  /* ---------- title bar ---------- */
  .titlebar{
    background:linear-gradient(180deg, var(--header-from) 0%, var(--header-to) 100%);
    border-bottom:2px solid var(--accent);
    padding:14px 20px;
    text-align:center;
    flex-shrink:0;
    box-shadow:0 1px 6px rgba(10,30,55,0.12);
  }
  .titlebar h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    color:#204a72;
    letter-spacing:.01em;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    background:var(--toolbar-bg);
    border-bottom:1px solid var(--border);
    padding:8px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    flex-shrink:0;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .tool-group{display:flex; align-items:center; gap:6px;}
  .divider{width:1px; height:22px; background:var(--border);}

  select{
    font-family:Roboto, Arial, sans-serif;
    font-size:13px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#fff;
    color:var(--text);
    cursor:pointer;
  }
  select:hover{border-color:#a9c5e0;}
  #fontFamilySelect{width:130px;}
  #fontSizeSelect{width:74px;}

  .icon-btn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid transparent;
    border-radius:6px;
    background:transparent;
    color:#4b4f56;
    cursor:pointer;
  }
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn:hover{background:var(--accent-soft); border-color:#c7dcf0;}
  .icon-btn:active{background:#d3e6f7;}
  .icon-btn.active{background:#d3e6f7; border-color:#a9c9e3; color:var(--accent);}

  .text-btn{
    font-family:Roboto, Arial, sans-serif;
    font-size:13px;
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#fff;
    color:var(--text);
    cursor:pointer;
    white-space:nowrap;
  }
  .text-btn:hover{background:var(--accent-soft); border-color:#c7dcf0;}
  .text-btn:active{background:#d3e6f7;}

  .toolbar-spacer{flex:1;}

  /* ---------- page area ---------- */
  .page-wrap{
    flex:1;
    display:flex;
    justify-content:center;
    padding:22px 20px 0;
    overflow-y:auto;
  }
  .page-card{
    width:100%;
    max-width:850px;
    background:var(--paper);
    border-radius:8px 8px 0 0;
    box-shadow:0 10px 34px rgba(9,28,52,0.28), 0 2px 8px rgba(9,28,52,0.14);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:260vh;
    height:fit-content;
  }
  .page-accent{
    height:5px;
    flex-shrink:0;
    background:linear-gradient(90deg, #2f6fa8, #6bb0d8);
  }
  .page{
    flex:1;
    padding:18px 56px 120px;
    font-size:16px;
    line-height:1.7;
    outline:none;
  }
  .page:empty::before{
    content:"Start typing…";
    color:#b7bac0;
  }

  /* ---------- status bar ---------- */
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 20px;
    font-size:12px;
    color:#eaf1f9;
    border-top:1px solid rgba(255,255,255,0.18);
    background:rgba(10,35,60,0.28);
    backdrop-filter:blur(6px);
    flex-shrink:0;
  }
  #saveStatus{min-width:70px;}

  @media (max-width:640px){
    .page{padding:16px 22px 100px;}
    .toolbar{gap:8px;}
    #fontFamilySelect{width:105px;}
  }
</style>
</head>
<body>

<div class="titlebar">
  <h1>Notepad</h1>
</div>

<div class="toolbar">
  <div class="tool-group">
    <select id="fontFamilySelect" title="Font family">
      <option value="Roboto, Arial, sans-serif">Roboto</option>
      <option value="Arial, sans-serif">Arial</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="Verdana, sans-serif">Verdana</option>
    </select>
    <select id="fontSizeSelect" title="Font size">
      <option value="12">12</option>
      <option value="14">14</option>
      <option value="16" selected>16</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="28">28</option>
      <option value="32">32</option>
      <option value="40">40</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <button class="icon-btn" id="boldBtn" title="Bold">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h7a4 4 0 0 1 0 8H6z"></path><path d="M6 12h8a4 4 0 0 1 0 8H6z"></path></svg>
    </button>
    <button class="icon-btn" id="italicBtn" title="Italic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
    </button>
    <button class="icon-btn" id="underlineBtn" title="Underline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a6 6 0 0 0 12 0V3"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
    </button>
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <button class="icon-btn" id="undoBtn" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M3 13a9 9 0 1 0 3-7"></path></svg>
    </button>
    <button class="icon-btn" id="redoBtn" title="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M21 13a9 9 0 1 1-3-7"></path></svg>
    </button>
  </div>

  <div class="toolbar-spacer"></div>

  <div class="tool-group">
    <button class="text-btn" id="clearBtn">New</button>
    <button class="text-btn" id="downloadBtn">Download .txt</button>
  </div>
</div>

<div class="page-wrap">
  <div class="page-card">
    <div class="page-accent"></div>
    <div class="page" id="editor" contenteditable="true" spellcheck="false"></div>
  </div>
</div>

<div class="statusbar">
  <span id="saveStatus"></span>
  <span id="wordCount">0 words</span>
</div>

<script>
(function(){
  "use strict";

  var HTML_KEY = "notepad_html_v2";
  var editor = document.getElementById("editor");
  var saveStatus = document.getElementById("saveStatus");
  var wordCount = document.getElementById("wordCount");

  // ---------- load saved content ----------
  var saved = localStorage.getItem(HTML_KEY);
  if(saved) editor.innerHTML = saved;
  editor.style.fontFamily = "Roboto, Arial, sans-serif";

  // ---------- word count ----------
  function updateWordCount(){
    var text = editor.innerText.trim();
    var words = text.length ? text.split(/\s+/).length : 0;
    wordCount.textContent = words + (words === 1 ? " word" : " words");
  }
  updateWordCount();

  // ---------- autosave, debounced ----------
  // localStorage writes are local-only (no network / no bandwidth cost at
  // all), but we still debounce so a fast typist isn't triggering a write on
  // every keystroke. Saves 700ms after you stop typing, with a periodic
  // safety save every 5s if you keep typing continuously, and an immediate
  // save whenever the tab is hidden or closed.
  var debounceTimer = null;
  var periodicTimer = null;
  var dirty = false;

  function saveNow(){
    localStorage.setItem(HTML_KEY, editor.innerHTML);
    dirty = false;
    saveStatus.textContent = "Saved";
    clearTimeout(saveStatus._clearTimer);
    saveStatus._clearTimer = setTimeout(function(){ saveStatus.textContent = ""; }, 1200);
  }

  function markDirty(){
    dirty = true;
    saveStatus.textContent = "";
    updateWordCount();

    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(saveNow, 700);

    if(!periodicTimer){
      periodicTimer = setInterval(function(){
        if(dirty) saveNow();
        else{ clearInterval(periodicTimer); periodicTimer = null; }
      }, 5000);
    }
  }

  editor.addEventListener("input", markDirty);

  window.addEventListener("beforeunload", function(){ if(dirty) saveNow(); });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && dirty) saveNow();
  });

  // ---------- formatting ----------
  function exec(cmd, val){
    editor.focus();
    document.execCommand(cmd, false, val || null);
    markDirty();
  }

  document.getElementById("boldBtn").addEventListener("click", function(){ exec("bold"); });
  document.getElementById("italicBtn").addEventListener("click", function(){ exec("italic"); });
  document.getElementById("underlineBtn").addEventListener("click", function(){ exec("underline"); });
  document.getElementById("undoBtn").addEventListener("click", function(){ exec("undo"); });
  document.getElementById("redoBtn").addEventListener("click", function(){ exec("redo"); });

  document.getElementById("fontFamilySelect").addEventListener("change", function(e){
    exec("fontName", e.target.value);
  });

  // Font size: execCommand only supports 7 legacy sizes, so we apply size 7
  // as a marker then rewrite the resulting <font> tags to real pixel sizes.
  document.getElementById("fontSizeSelect").addEventListener("change", function(e){
    var px = e.target.value;
    editor.focus();
    document.execCommand("fontSize", false, "7");
    var marks = editor.querySelectorAll('font[size="7"]');
    marks.forEach(function(el){
      el.removeAttribute("size");
      el.style.fontSize = px + "px";
    });
    markDirty();
  });

  // keep the size dropdown in sync with the cursor position
  function syncToolbarState(){
    document.getElementById("boldBtn").classList.toggle("active", document.queryCommandState("bold"));
    document.getElementById("italicBtn").classList.toggle("active", document.queryCommandState("italic"));
    document.getElementById("underlineBtn").classList.toggle("active", document.queryCommandState("underline"));
  }
  editor.addEventListener("keyup", syncToolbarState);
  editor.addEventListener("mouseup", syncToolbarState);
  editor.addEventListener("focus", syncToolbarState);

  // ---------- new / clear ----------
  document.getElementById("clearBtn").addEventListener("click", function(){
    if(editor.innerText.trim().length === 0) return;
    if(confirm("Start a new note? This clears the current text (your last download, if any, is unaffected).")){
      editor.innerHTML = "";
      localStorage.removeItem(HTML_KEY);
      updateWordCount();
      editor.focus();
    }
  });

  // ---------- download as .txt ----------
  document.getElementById("downloadBtn").addEventListener("click", function(){
    var blob = new Blob([editor.innerText], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "notepad-" + stamp + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  editor.focus();
})();
</script>

</body>
</html>
